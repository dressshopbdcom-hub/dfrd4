<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Country Flag Battle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Rajdhani:wght@600;700&display=swap">
<style>
/* Layout: one-screen arcade stage. Header, ranking panel, round arena + flag tray on one canvas, two stream buttons at the bottom. */
:root{
  --bg:#030612; --bg2:#0a1a44; --panel:#0b1c48; --panel-line:#2a5bc0;
  --ring:#19b6ff; --gold:#ffc83a; --ink:#e8f1ff; --mute:#8fa3d0;
  --font-display:Rajdhani,"Barlow Semi Condensed",system-ui,sans-serif;
  --font-body:"Barlow Semi Condensed",Rajdhani,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;overflow:hidden;
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
#app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
header{position:relative;text-align:center;padding:6px 40px 6px}
h1{margin:0;font:700 clamp(15px,4.8vw,21px)/1.15 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
#sub{color:var(--gold);font:700 12px/1.3 var(--font-display);letter-spacing:.05em;min-height:16px;text-transform:uppercase}
#menuBtn{position:absolute;left:0;top:6px;width:34px;height:34px;border:1px solid #1d3a7a;background:#0a1840;color:var(--ink);border-radius:8px;font-size:18px;cursor:pointer}
#panel{border:1.5px solid var(--panel-line);border-radius:10px;background:linear-gradient(#0d2352,#091640);height:124px;padding:7px 10px;overflow:hidden;box-shadow:0 0 18px rgba(30,100,255,.25) inset}
#panel h2{margin:0 0 4px;text-align:center;font:700 12px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase}
.row{display:grid;grid-template-columns:30px 22px minmax(0,1fr) auto;gap:6px;align-items:center;height:19px;font-size:12px;line-height:1;color:#bccbef}
.row .rk{color:#6f86bd;font-family:var(--font-display);font-weight:700}
.row .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .w{font-family:var(--font-display);font-weight:600;color:#7f95c6}
.row.first{color:#fff;background:linear-gradient(90deg,rgba(25,130,255,.35),rgba(25,130,255,.05));border-radius:4px}
.row.first .rk,.row.first .w{color:var(--gold)}
.row img,.chip img{width:20px;height:15px;object-fit:cover;border-radius:2px;display:block}
#chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 8px}
.chip{display:flex;align-items:center;gap:5px;height:18px;font-size:11px;min-width:0;color:#d8e4ff}
.chip span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.out{opacity:.28}
#top1{text-align:center;font:700 12px/1 var(--font-display);color:var(--gold);padding:9px 0 3px;min-height:26px;letter-spacing:.05em;text-transform:uppercase;display:flex;gap:6px;justify-content:center;align-items:center}
#top1 img{width:18px;height:13px;border-radius:2px}
canvas{flex:1;min-height:0;width:100%;display:block;touch-action:manipulation}
footer{display:flex;gap:8px;justify-content:center;padding:8px 0 12px}
footer button{white-space:nowrap;border:1.5px solid #8a6a20;background:linear-gradient(#3a2d0f,#241a08);color:var(--gold);font:700 13px/1 var(--font-display);letter-spacing:.05em;padding:10px 13px;border-radius:10px;text-transform:uppercase;cursor:pointer}
footer button.on{background:linear-gradient(#6a4f12,#3d2d09);box-shadow:0 0 12px rgba(255,200,58,.35)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.18);text-shadow:0 0 18px rgba(255,200,58,.9)}100%{transform:scale(1)}}
#top1.pulse{animation:pop 1.2s ease-out}
button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
#menu[hidden]{display:none}
#menu{position:fixed;inset:0;background:rgba(2,5,16,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
#sheet{width:100%;max-width:520px;background:#0a1535;border:1.5px solid var(--panel-line);border-bottom:0;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
#sheet h3{margin:0 0 10px;font:700 15px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #16295e;font-size:14px}
.set>span{min-width:0}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button,.act button,#sheet .x{border:1px solid #2a4a96;background:#0e2050;color:var(--ink);font:600 13px var(--font-display);border-radius:8px;padding:7px 11px;cursor:pointer;min-width:34px}
.seg button.sel{background:var(--ring);color:#021226;border-color:var(--ring)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act button{flex:1;padding:10px;font-size:14px}
.act button.hot{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
.val{min-width:42px;text-align:center;font:700 15px var(--font-display)}
</style>

<div id="app">
  <header>
    <button id="menuBtn" aria-label="Menu">☰</button>
    <h1 id="title"></h1>
    <div id="sub"></div>
  </header>
  <section id="panel" aria-live="off"><h2 id="panelTitle"></h2><div id="panelBody"></div></section>
  <div id="top1"></div>
  <canvas id="cv" aria-label="Flag battle arena"></canvas>
  <footer>
    <button id="timerBtn"></button>
    <button id="plusBtn"></button>
    <button id="soundBtn"></button>
  </footer>
</div>
<div id="menu" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>

(()=>{

const CODES=Object.keys(FLAGS), TOTAL=CODES.length;
const cv=$('cv'), ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,L={};

/* ---------- settings ---------- */
const S={lang:'en',rounds:6,roundSec:45,finalists:8,auto:true,speed:1,timerMin:35};
try{Object.assign(S,JSON.parse(localStorage.getItem('cfb4')||'{}'))}catch(e){}
S.speed=1;S.lang='en';

const qsp=new URLSearchParams(location.search); if(qsp.get('speed'))S.speed=+qsp.get('speed')||1;
const save=()=>{try{localStorage.setItem('cfb4',JSON.stringify(S))}catch(e){}};

const TX={en:{title:'COUNTRY FLAG BATTLE',round:'ROUND {n}',final:'FINAL ROUND',qual:'QUALIFYING',lb:'LEADERBOARD',qf:'QUALIFIED FOR FINAL',

const nf={en:new Intl.NumberFormat('en',{useGrouping:false})};
const fmt=n=>nf.en.format(n);
const t=(k,o={})=>TX.en[k].replace(/\{(\w+)\}/g,(m,a)=>o[a]);
const dnMap={},nmCache={};
function nm(c,l=S.lang){const k=l+c;if(nmCache[k])return nmCache[k];let v=c;
  try{dnMap[l]=dnMap[l]||new Intl.DisplayNames([l],{type:'region'});v=dnMap[l].of(c)||c}catch(e){}
  return nmCache[k]=v}

/* ---------- sound ---------- */
const AU={on:false,ctx:null,blip:0};
function actx(){if(!AU.ctx){try{AU.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AU.ctx}
/* keep audio alive in WebView / kiosk browsers: resume the context after any touch, tab return, or system suspend */
const unlockAudio=()=>{const c=AU.ctx;if(c&&c.state!=='running'&&c.resume)c.resume().catch(()=>{})};
['touchstart','touchend','pointerdown','click','keydown'].forEach(e=>document.addEventListener(e,unlockAudio,{passive:true}));

function setupRound(list){
  T.fieldN=list.length;T.esc=[];T.t=0;T.lastT=0;T.winner=null;T.gapC=rand()*TAU;T.gapW=GAP;
  let rr=Math.min(.2,.045*Math.sqrt(TOTAL/list.length)),fl;
  const order=list.slice().sort(()=>rand()-.5);
  for(let guard=0;guard<60;guard++){
    fl=[];let ok=true;
    for(const c of order){
      let placed=false;
      for(let a=0;a<300&&!placed;a++){
        const ang=rand()*TAU,d=Math.sqrt(rand())*(1-rr-.04),x=Math.cos(ang)*d,y=Math.sin(ang)*d;
        if(fl.every(f=>(f.x-x)**2+(f.y-y)**2>=(2.14*rr)**2)){
          const va=rand()*TAU,vs=.8+rand()*.4;
          fl.push({c,x,y,vx:Math.cos(va)*vs,vy:Math.sin(va)*vs,r:rr,s:0});placed=true}

}

/* ---------- layout ---------- */
function layout(){

  const pick=(avail)=>{for(let c=Math.min(n,10);c<=Math.min(n,39);c++){const w=Math.min((W-16)/c,30),h=w*.8;if(Math.ceil(n/c)*h<=avail)return c}return Math.min(n,39)};
  cols=pick(H-2*R-62);

  const trayH=Math.ceil(n/cols)*sh;
  if(2*R+62+trayH>H)R=Math.max(60,(H-trayH-62)/2);

}

/* ---------- simulation ---------- */
function stepPlay(dt){
  T.t+=dt;
  T.gapC+=1.15*dt;
  T.gapW=GAP;
  const fl=T.flags,n=fl.length,gh=T.gapW/2;let alive=0;
  for(let i=0;i<n;i++){const a=fl[i];if(a.s)continue;a.x+=a.vx*dt;a.y+=a.vy*dt}
  for(let i=0;i<n;i++){const a=fl[i];if(a.s)continue;
    for(let j=i+1;j<n;j++){const b=fl[j];if(b.s)continue;
      const dx=b.x-a.x,rr=a.r+b.r;if(dx>rr||dx<-rr)continue;const dy=b.y-a.y,d2=dx*dx+dy*dy;
      if(d2>=rr*rr||d2===0)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(rr-d)/2;
      a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(rv<0){a.vx+=rv*nx;a.vy+=rv*ny;b.vx-=rv*nx;b.vy-=rv*ny}
    }}
  for(let i=0;i<n;i++){const a=fl[i];if(a.s)continue;
    const d=Math.hypot(a.x,a.y);
    if(d>1-a.r){
      let rel=Math.atan2(a.y,a.x)-T.gapC;rel=Math.atan2(Math.sin(rel),Math.cos(rel));
      const inGap=Math.abs(rel)<gh;
      if(!inGap&&d<1){
        const nx=a.x/d,ny=a.y/d,vn=a.vx*nx+a.vy*ny;
        if(vn>0){a.vx-=2*vn*nx;a.vy-=2*vn*ny;const j=(rand()-.5)*.06,cj=Math.cos(j),sj=Math.sin(j),ux=a.vx*cj-a.vy*sj;a.vy=a.vx*sj+a.vy*cj;a.vx=ux}
        a.x=nx*(1-a.r);a.y=ny*(1-a.r);
      }else if(d>1+a.r*.9){escape(a);continue}
    }
    let sp=Math.hypot(a.vx,a.vy)||.01;
    const target=sp<.7?.7:sp>1.5?1.5:sp+(1.0-sp)*.6*dt;
    a.vx*=target/sp;a.vy*=target/sp;

  }

}
function escape(a){
  a.s=1;a.px=L.cx+a.x*L.R;a.py=L.cy+a.y*L.R;a.vx*=L.R;a.vy*=L.R;a.sz0=L.R*2*a.r*1.12;a.y0=a.py;
  a.idx=T.esc.length;T.esc.push(a);
  if(AU.on&&T.clock-AU.blip>.06){AU.blip=T.clock;tone(420+rand()*520,.07,'triangle',.03)}
}
function updateFalling(dt){
  for(const a of T.esc){if(a.s!==1)continue;
    const sl=slot(a.idx);
    a.vy+=3.4*L.R*dt;a.vx*=Math.pow(.25,dt);
    a.px+=a.vx*dt+(sl.x-a.px)*Math.min(1,2.6*dt);a.py+=a.vy*dt;
    if(a.py>=sl.y){a.s=2}
  }
}
function finishRound(){
  const remain=T.flags.filter(f=>!f.s)[0];
  const winner=remain||T.esc[T.esc.length-1];
  const order=[winner,...T.esc.filter(f=>f!==winner).reverse()];
  T.placements=order.map(f=>f.c);T.winner=winner.c;
  if(remain)remain.s=3;
  T.conf=makeConf();
  if(T.final){T.champ=true;setPhase('champ');fanfare(true);say(nm(T.winner)+' is the grand champion!')}
  else{
    T.wins[winner.c]=(T.wins[winner.c]||0)+1;T.winsVer++;
    [5,4,3,2,1].forEach((p,i)=>{const c=T.placements[i];if(c)T.pts[c]=(T.pts[c]||0)+p});
    setPhase('win');T.lbHold=T.clock+6;fanfare(false);say(nm(T.winner)+' wins round '+T.round);
  }
}
const CONF=['#ffc83a','#19b6ff','#ff4d6d','#7dff9b','#ffffff','#b46bff'];
function makeConf(){const a=[];for(let i=0;i<110;i++)a.push({x:L.cx+(rand()-.5)*L.R*.8,y:L.cy-L.R*.1,vx:(rand()-.5)*L.R*1.9,vy:-(.5+rand()*1.6)*L.R,w:4+rand()*5,h:6+rand()*7,r:rand()*TAU,vr:(rand()-.5)*12,c:CONF[i%CONF.length]});return a}
function updateConf(dt){for(const p of T.conf){p.vy+=L.R*1.7*dt;p.vx*=Math.pow(.6,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt}}
function afterWin(){
  T.conf=[];
  if(T.off){T.pending=true;setPhase('idle');return}
  nextRound();
}
function afterChamp(){
  if(S.auto&&!T.off)startTournament();else{T.pending=true;setPhase('idle')}
}
function step(dt){
  T.clock+=dt;T.phaseT+=dt;updateFalling(dt);if(T.conf.length&&(T.phase==='win'||T.phase==='champ'))updateConf(dt);
  switch(T.phase){
    case'intro':if(T.phaseT>2.2)setPhase('play');break;
    case'play':stepPlay(dt);break;
    case'win':if(T.phaseT>4.6)afterWin();break;
    case'champ':if(T.phaseT>8)afterChamp();break;
    case'idle':if(T.pending&&!T.off){T.pending=false;T.champ?startTournament():nextRound()}break;
  }

/* ---------- drawing ---------- */
const FONT=(w,px)=>`${w} ${px}px Rajdhani,"Barlow Semi Condensed",sans-serif`;
function flagAt(c,x,y,w){const h=w*.75;ctx.drawImage(IMG[c],x-w/2,y-h/2,w,h)}
function textOut(s,x,y,fill,stroke){ctx.lineJoin='round';ctx.lineWidth=Math.max(3,L.R*.03);ctx.strokeStyle=stroke||'rgba(2,6,20,.9)';ctx.strokeText(s,x,y);ctx.fillStyle=fill;ctx.fillText(s,x,y)}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const {cx,cy,R}=L;
  ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fillStyle='rgba(6,16,48,.6)';ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(25,182,255,.14)';ctx.stroke();
  const vis=TAU-T.gapW;
  if(vis>.02&&T.phase!=='idle'||T.phase==='idle'&&vis>.02){
    ctx.save();ctx.lineCap='round';
    ctx.shadowColor='#19b6ff';ctx.shadowBlur=16;ctx.strokeStyle='#19b6ff';ctx.lineWidth=Math.max(3,R*.016);
    ctx.beginPath();ctx.arc(cx,cy,R,T.gapC+T.gapW/2,T.gapC+T.gapW/2+vis);ctx.stroke();
    ctx.shadowBlur=0;ctx.strokeStyle='rgba(190,235,255,.55)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
  }
  for(const f of T.flags){if(f.s)continue;flagAt(f.c,cx+f.x*R,cy+f.y*R,R*2*f.r*1.12)}
  const sw=L.sw*.92;
  for(const a of T.esc){
    if(a.s===2){const s=slot(a.idx);flagAt(a.c,s.x,s.y,sw)}
  }
  for(const a of T.esc){
    if(a.s===1){const s=slot(a.idx),k=Math.min(1,Math.max(0,(a.py-a.y0)/Math.max(1,s.y-a.y0)));
      flagAt(a.c,a.px,a.py,a.sz0+(sw-a.sz0)*k)}

  const bw=W*.6,bx=(W-bw)/2;
  ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.roundRect(bx,L.barY-3,bw,6,3);ctx.fill();
  if(frac>0){ctx.fillStyle='#ffc83a';ctx.beginPath();ctx.roundRect(bx,L.barY-3,Math.max(5,bw*Math.min(1,frac)),6,3);ctx.fill()}
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=FONT(700,11);ctx.fillStyle='#dbe6ff';
  ctx.fillText(t('cnt',{a:fmt(T.phase==='win'||T.phase==='champ'?1:rem),b:fmt(T.fieldN)}),cx,L.txtY);
  if(T.off){ctx.font=FONT(700,11);ctx.fillStyle='#ffc83a';ctx.fillText(t('off'),cx,L.barY-12)}
  if(T.phase==='intro'){

    ctx.save();ctx.globalAlpha=fade*k;

    ctx.font=FONT(700,R*.075);textOut(T.final?t('finalSub',{n:fmt(T.fieldN)}):t('classic',{n:fmt(T.fieldN)}),cx,cy+R*.2,'#e8f1ff');
    ctx.restore();

function fitText(txt,px,maxW){ctx.font=FONT(700,px);const w=ctx.measureText(txt).width;if(w>maxW)px*=maxW/w;ctx.font=FONT(700,px);return px}
function drawWinner(champ){
  const {cx,cy,R}=L,dur=champ?8:4.6,pt=T.phaseT;
  const k=Math.min(1,pt/.6),e=1+2.2*Math.pow(k-1,3)+1.2*Math.pow(k-1,2);
  const ex=Math.max(0,pt-(dur-1)),rise=ex*ex*R*1.3,alpha=Math.max(0,1-ex*1.15);

  ctx.translate(cx,cy-rise);

  const g=ctx.createRadialGradient(0,0,0,0,0,R*.95);g.addColorStop(0,'rgba(255,200,58,.55)');g.addColorStop(1,'rgba(255,200,58,0)');

  ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='middle';
  // ribbon

  ctx.font=FONT(700,R*.082);const lw=ctx.measureText(label).width+R*.18,lh=R*.13;
  ctx.fillStyle='#ffc83a';ctx.shadowColor='rgba(255,200,58,.7)';ctx.shadowBlur=14;
  ctx.beginPath();ctx.roundRect(-lw/2,-R*.66-lh/2,lw,lh,lh/2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#241700';ctx.fillText(label,0,-R*.655);

  ctx.shadowColor='rgba(255,200,58,.85)';ctx.shadowBlur=24;ctx.fillStyle='#fff';ctx.fillRect(-fw/2-3,-R*.12-fh/2-3,fw+6,fh+6);ctx.shadowBlur=0;
  ctx.drawImage(IMG[T.winner],-fw/2,-R*.12-fh/2,fw,fh);
  // name
  fitText(nm(T.winner).toUpperCase(),R*.16,R*1.45);textOut(nm(T.winner).toUpperCase(),0,R*.3,'#ffffff');
  // podium
  if(!champ){[[1,-R*.42,'2ND'],[2,R*.42,'3RD']].forEach(([i,x,lb])=>{const c=T.placements[i];if(!c)return;
    flagAt(c,x,R*.56,R*.2);ctx.font=FONT(700,R*.055);ctx.fillStyle='#ffc83a';ctx.fillText(lb,x,R*.67);
    fitText(nm(c),R*.055,R*.8);ctx.fillStyle='#dfe9ff';ctx.fillText(nm(c),x,R*.75)})}

  ctx.save();ctx.globalAlpha=alpha;
  for(const p of T.conf){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
  ctx.restore();
}

  if(lastKey.sub!==sub){$('sub').textContent=sub;lastKey.sub=sub}
  const ttl=t('title',{n:fmt(TOTAL)});
  if(lastKey.ttl!==ttl){$('title').textContent=ttl;document.title='Country Flag Battle';lastKey.ttl=ttl}
  // top 1
  const top=ranked()[0],has=top&&(T.wins[top]||0)>0;
  const tk='t'+S.lang+T.winsVer;
  if(lastKey.top!==tk){if(lastKey.top){const el=$('top1');el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse')}
   $('top1').innerHTML=`🏆 ${t('top')} - ${has?`${esc(nm(top).toUpperCase())} <img alt="" src="${FLAGS[top]}">`:'—'}`;lastKey.top=tk}
  // panel
  if(T.final&&T.phase!=='idle'||T.final&&T.champ){
    const alive=T.flags.filter(f=>!f.s).length+(T.winner&&T.phase!=='play'?1:0);
    const k='f'+S.lang+T.round+alive+T.phase;
    if(lastKey.panel!==k){
      $('panelTitle').textContent=t('qf');
      const outSet=new Set(T.esc.map(f=>f.c));
      $('panelBody').innerHTML='<div id="chips">'+T.finalists.map(c=>`<div class="chip${outSet.has(c)?' out':''}"><img alt="" src="${FLAGS[c]}"><span>${esc(nm(c))}</span></div>`).join('')+'</div>';
      lastKey.panel=k}
  }else{
    const pages=Math.ceil(TOTAL/5),page=T.clock<T.lbHold?0:Math.floor(T.clock/3.2)%pages;
    const k='l'+S.lang+T.winsVer+page;
    if(lastKey.panel!==k){
      $('panelTitle').textContent=t('lb');
      const rk=ranked();
      $('panelBody').innerHTML=rk.slice(page*5,page*5+5).map((c,i)=>{const r=page*5+i+1,w=T.wins[c]||0;
        return `<div class="row${r===1&&w?' first':''}"><span class="rk">#${fmt(r)}</span><img alt="" src="${FLAGS[c]}"><span class="nm">${esc(nm(c))}</span><span class="w">${t(w===1?'win1':'wins',{n:fmt(w)})}</span></div>`}).join('');
      lastKey.panel=k}
  }
  const tb=T.timerEnd?'on':'';
  if(lastKey.tb!==tb+S.lang){$('timerBtn').className=tb;$('timerBtn').textContent='⏱ '+t('timer');$('plusBtn').textContent=t('plus');lastKey.tb=tb+S.lang}
  const sb=(AU.on?'on':'off');
  if(lastKey.sb!==sb){$('soundBtn').textContent=(AU.on?'🔊 ':'🔇 ')+t(AU.on?'sOn':'sOff');$('soundBtn').className=AU.on?'on':'';lastKey.sb=sb}
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function timerLeft(){
  if(!T.timerEnd)return null;
  const ms=T.timerEnd-Date.now();
  if(ms<=0){T.timerEnd=null;T.off=true;return null}
  const s=Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
$('timerBtn').onclick=()=>{
  if(T.timerEnd){T.timerEnd=null}
  else{T.off=false;T.timerEnd=Date.now()+S.timerMin*60000}
};
$('plusBtn').onclick=()=>{
  T.off=false;T.timerEnd=(T.timerEnd||Date.now())+5*60000;
};

/* ---------- menu ---------- */
function openMenu(){renderMenu();$('menu').hidden=false}
function closeMenu(){$('menu').hidden=true}
$('menuBtn').onclick=openMenu;
$('menu').addEventListener('click',e=>{if(e.target.id==='menu')closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
function seg(key,vals,label){return `<div class="seg">`+vals.map(v=>`<button data-k="${key}" data-v="${v}" class="${S[key]===v?'sel':''}">${label?label(v):v}</button>`).join('')+`</div>`}
function step_(key,min,max,inc){return `<div class="seg"><button data-s="${key}" data-d="-${inc}" data-min="${min}" data-max="${max}">−</button><span class="val">${fmt(S[key])}</span><button data-s="${key}" data-d="${inc}" data-min="${min}" data-max="${max}">+</button></div>`}
function renderMenu(){
  $('sheet').innerHTML=`<h3><span>${t('menu')}</span><button class="x" data-a="close">${t('close')}</button></h3>
  <div class="set"><span>${t('rounds')}</span>${step_('rounds',1,30,1)}</div>
  <div class="set"><span>${t('fin')}</span>${seg('finalists',[4,8,12,16],v=>fmt(v))}</div>
  <div class="set"><span>${t('tmin')}</span>${step_('timerMin',5,120,5)}</div>
  <div class="set"><span>${t('spd')}</span>${seg('speed',[1,2,4],v=>v+'×')}</div>
  <div class="set"><span>${t('auto')}</span>${seg('auto',[true,false],v=>v?t('on'):t('off2'))}</div>
  <div class="act"><button data-a="pause">${T.paused?t('resume'):t('pause')}</button><button data-a="skip">${t('skip')}</button><button class="hot" data-a="new">${t('neu')}</button></div>`;
}
$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){let v=b.dataset.v;S[b.dataset.k]=v==='true'?true:v==='false'?false:isNaN(v)||b.dataset.k==='lang'?v:+v;save();lastKey={};renderMenu()}
  else if(b.dataset.s){const k=b.dataset.s;S[k]=Math.min(+b.dataset.max,Math.max(+b.dataset.min,S[k]+ +b.dataset.d));save();renderMenu()}
  else if(b.dataset.a==='close')closeMenu();
  else if(b.dataset.a==='pause'){T.paused=!T.paused;renderMenu()}
  else if(b.dataset.a==='skip'){if(T.phase==='play')T.fast=true;else if(T.phase==='intro')setPhase('play');closeMenu()}
  else if(b.dataset.a==='new'){closeMenu();startTournament()}
});

/* ---------- loop ---------- */
let last=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(!T.paused){
    const sdt=dt*S.speed*(T.fast&&T.phase==='play'?10:1),n=Math.max(1,Math.ceil(sdt/.012));
    for(let i=0;i<n;i++)step(sdt/n);
  }
  draw();ui();requestAnimationFrame(frame);
}
function boot(){resize();startTournament();requestAnimationFrame(t=>{last=t;frame(t)});
  try{window.__T=T}catch(e){}}
})();
</script>

</body></html>
